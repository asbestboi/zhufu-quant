[project]
name = "qr"
version = "0.1.0"
description = "Personal quant research: market data pipeline and backtesting engines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.12",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
crypto = ["ccxt>=4.4"]

[project.scripts]
qr = "qr.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "mypy>=1.11",
    "nbconvert>=7.16",
    "pandas-stubs>=2.2",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits a real data provider (skipped unless --run-network is given)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]  # specs are hand-off documents, not ours to reformat

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "ccxt.*", "pandas_market_calendars.*"]
ignore_missing_imports = true
